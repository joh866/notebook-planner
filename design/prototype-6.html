<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner prototype 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --hand:'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
body[data-mode="day"] {
  --bg:#EEECE4; --dots:#C9C3B2; --ink:#253047; --muted:#6B7180; --line:#D6D0C0;
  --panel:#F7F5EF; --card:#FCFBF8; --card-border:#D3CDBC; --frame:rgba(37,48,71,.55);
  --accent:#2F4F9E; --red:#C2413B; --hl:rgba(224,177,42,.45);
  --chip:rgba(37,48,71,.07); --hover:rgba(37,48,71,.07); --past:rgba(37,48,71,.045); --off:rgba(37,48,71,.035);
  --surround:#D8D5CB; --scrim:rgba(30,36,51,.16); --hl-green:rgba(63,154,115,.32); --amber:#A8670F;
  --c-class:#3D63C9; --c-errand:#E0B12A; --c-growth:#3F9A73; --c-life:#D46B95; --c-routine:#8A79C6; --fill:30%;
}
body[data-mode="night"] {
  --bg:#1B2130; --dots:#2D3545; --ink:#E4DFD1; --muted:#979DAB; --line:#323A4C;
  --panel:#20273A; --card:#252D41; --card-border:#3A4359; --frame:rgba(228,223,209,.42);
  --accent:#93B1F2; --red:#EF7F73; --hl:rgba(232,193,78,.32);
  --chip:rgba(228,223,209,.08); --hover:rgba(228,223,209,.08); --past:rgba(0,0,0,.16); --off:rgba(0,0,0,.14);
  --surround:#10141D; --scrim:rgba(0,0,0,.35); --hl-green:rgba(108,199,158,.28); --amber:#E8B464;
  --c-class:#7E9CF0; --c-errand:#E8C14E; --c-growth:#6CC79E; --c-life:#EE93B6; --c-routine:#ADA0EC; --fill:26%;
}
body { --c-none:#8A8F99; --dotbg:radial-gradient(var(--dots) 1.1px, transparent 1.4px); }

* { box-sizing:border-box; margin:0; padding:0; }
body {
  min-height:100vh; color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.45;
  background-color:var(--bg); background-image:var(--dotbg); background-size:20px 20px;
  -webkit-font-smoothing:antialiased; transition:background-color .3s, color .3s;
}
button, input, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
[hidden] { display:none !important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
body.is-dragging, body.is-dragging * { cursor:grabbing !important; user-select:none; -webkit-user-select:none; }
.ic { width:12px; height:12px; flex:none; }
.box { border:1.5px solid var(--frame); background:var(--panel); border-radius:5px 7px 6px 4px; color:var(--ink); }
button.box:hover { background:var(--hover); }

/* ---------- Preview harness (temporary) ---------- */
.harness { background:#1E2433; color:#E9E5DA; font-size:13px; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 20px; align-items:center; justify-content:center; position:relative; z-index:50; }
.harness .opt { display:flex; align-items:center; gap:7px; }
.harness .opt > span { opacity:.65; }
.harness .seg { display:flex; background:rgba(255,255,255,.08); border-radius:8px; padding:2px; }
.harness .seg button { border:0; background:transparent; padding:4px 10px; border-radius:6px; font-size:13px; opacity:.72; color:#E9E5DA; }
.harness .seg button:hover { opacity:1; }
.harness .seg button[aria-pressed="true"] { background:rgba(255,255,255,.18); opacity:1; }

/* ---------- Wide layout ---------- */
body[data-layout="wide"] .device { max-width:1720px; margin:0 auto; padding:22px 28px 60px; }
body[data-layout="wide"] .screen { display:grid; grid-template-columns:minmax(0, 7fr) minmax(340px, 4.6fr); grid-template-areas:"top top" "main tasks"; column-gap:24px; }
.top { grid-area:top; }
.main { grid-area:main; min-width:0; }
.tasks { grid-area:tasks; min-width:0; }
body[data-layout="wide"] #dayView { border:1.5px solid var(--frame); border-radius:8px; background:var(--panel); padding:12px 14px 18px; }
body[data-layout="wide"] .tasks { position:sticky; top:14px; align-self:start; max-height:calc(100vh - 28px); display:flex; flex-direction:column; border:1.5px solid var(--frame); border-radius:8px; background:var(--panel); }
body[data-layout="wide"] .tasks-top { padding:12px 16px 0; }
body[data-layout="wide"] .tasks-inner { overflow:auto; padding:0 16px 16px; }
body[data-layout="wide"] .screen:not([data-view="day"]) .main { grid-column:main-start / tasks-end; }
.screen:not([data-view="day"]) .tasks, .screen:not([data-view="day"]) .backdrop { display:none !important; }
.handle, .backdrop { display:none; }

/* ---------- Phone layout ---------- */
body[data-layout="phone"] { background-image:none; background-color:var(--surround); }
body[data-layout="phone"] .stage { display:flex; justify-content:center; padding:20px 0 30px; }
body[data-layout="phone"] .device {
  width:390px; height:min(844px, calc(100vh - 140px)); min-height:560px; position:relative; overflow:hidden;
  border:10px solid #151A26; border-radius:46px; box-shadow:0 20px 50px rgba(0,0,0,.25); background:var(--bg);
}
body.real-phone .stage { padding:0; }
body.real-phone .device { width:100%; height:100dvh; min-height:0; border:0; border-radius:0; box-shadow:none; }
body[data-layout="phone"] .screen { height:100%; display:flex; flex-direction:column; overflow:hidden; position:relative; }
body[data-layout="phone"] .top { padding:14px 14px 4px; }
body[data-layout="phone"] .main { flex:1; overflow:auto; padding:6px 12px 90px; background-image:var(--dotbg); background-size:20px 20px; background-attachment:local; }
body[data-layout="phone"] .backdrop { display:block; position:absolute; inset:0; z-index:25; background:var(--scrim); }
body[data-layout="phone"] .backdrop[hidden] { display:none !important; }
body[data-layout="phone"] .tasks {
  position:absolute; left:0; right:0; bottom:0; z-index:30; height:64px; display:flex; flex-direction:column;
  background:var(--panel); border-top:1.5px solid var(--frame); border-radius:22px 22px 0 0; box-shadow:0 -8px 26px rgba(0,0,0,.14);
}
body[data-layout="phone"] .handle {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; flex:none; height:62px;
  font-family:var(--hand); font-size:22px; font-weight:600; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
}
.handle .grab { width:40px; height:4px; border-radius:2px; background:var(--frame); }
body[data-layout="phone"] .tasks-top { padding:0 16px; }
body[data-layout="phone"] .tasks-inner { flex:1; overflow:auto; padding:0 16px 24px; }
body[data-layout="phone"] .daterow h1 { font-size:31px; }
body[data-layout="phone"] .clock { font-size:22px; }
body[data-layout="phone"] .rightcluster { width:100%; }
body[data-layout="phone"] .daterow { width:100%; justify-content:space-between; }
body[data-layout="phone"] .rightcluster { justify-content:space-between; }
body[data-layout="phone"] .tabs { flex:1; }
body[data-layout="phone"] .tabs > * { flex:1; justify-content:center; }
body[data-layout="phone"] .backtoday { height:32px; font-size:19px; padding:0 10px; }
body[data-layout="phone"] .tab { font-size:19px; height:32px; }
body[data-layout="phone"] .box.sq { width:32px; height:32px; }
body[data-layout="phone"] .sub { font-size:19px; }
body[data-layout="phone"] .grid { margin-left:50px; }
body[data-layout="phone"] .hour span, body[data-layout="phone"] .hidebtn { left:-48px; width:42px; }
body[data-layout="phone"] .now span { left:-50px; width:44px; font-size:11px; }
body[data-layout="phone"] .band { left:-50px; }

/* ---------- Header ---------- */
.headrow { display:flex; align-items:center; justify-content:space-between; gap:10px 16px; flex-wrap:wrap; }
.daterow { display:flex; align-items:baseline; gap:12px; min-width:0; }
.daterow h1 { font-family:var(--hand); font-size:46px; font-weight:700; line-height:1; white-space:nowrap; }
.clock { font-family:var(--hand); font-size:28px; color:var(--muted); white-space:nowrap; }
.rightcluster { display:flex; align-items:center; justify-content:flex-end; gap:6px; }
.iconpair { display:flex; gap:6px; }
.backtoday { color:var(--ink); white-space:nowrap; justify-content:center; }
body[data-layout="wide"] .phone-only, body[data-layout="phone"] .wide-only { display:none !important; }
body[data-layout="wide"] .tabs .tab { width:94px; justify-content:center; }
.tab.today-tab.on { background:var(--hl-green); border-color:var(--ink); color:var(--ink); }
.tabs { display:flex; gap:6px; }
.box.sq { width:36px; height:36px; display:grid; place-items:center; padding:0; }
.box.sq svg { width:20px; height:20px; }
.tab { font-family:var(--hand); font-size:22px; font-weight:600; height:36px; padding:0 13px; line-height:1; color:var(--muted); display:flex; align-items:center; }
.tab:hover { color:var(--ink); }
.tab.today { color:var(--ink); }
.tab.active { position:relative; background:var(--hl); color:var(--ink); border-color:var(--ink); padding:0 8px; gap:6px; overflow:hidden; }
.tab.active .lbl { display:flex; align-items:center; gap:7px; pointer-events:none; position:relative; z-index:1; }
.tab.active .chev { width:11px; height:11px; color:var(--ink); opacity:.55; transition:transform .15s, opacity .15s; }
.tab.active .half { position:absolute; top:0; bottom:0; width:50%; border:0; background:transparent; padding:0; z-index:2; }
.tab.active .half.prev { left:0; }
.tab.active .half.next { right:0; }
.tab.active .half:hover { background:rgba(37,48,71,.1); }
body[data-mode="night"] .tab.active .half:hover { background:rgba(255,255,255,.1); }
.tab.active:has(.prev:hover) .chev.l, .tab.active:has(.prev:focus-visible) .chev.l { opacity:1; transform:translateX(-2px); }
.tab.active:has(.next:hover) .chev.r, .tab.active:has(.next:focus-visible) .chev.r { opacity:1; transform:translateX(2px); }
.rule { height:2px; background:var(--ink); opacity:.5; margin:10px 0 8px; border-radius:2px; }
.sub { font-family:var(--hand); font-size:23px; line-height:1.15; color:var(--ink); }
.sub .lab { color:var(--muted); }
.sub .od { color:var(--red); font-weight:700; }
.sub .warn { color:var(--amber); display:block; }
.top { margin-bottom:14px; }

/* ---------- Checkbox and small buttons ---------- */
.cb { width:17px; height:17px; flex:none; border:1.6px solid currentColor; border-radius:3px; background:transparent; display:inline-grid; place-items:center; padding:0; color:var(--ink); opacity:.7; }
.cb:hover { opacity:1; }
.cb[aria-checked="true"] { opacity:1; }
.cb[aria-checked="true"]::after { content:''; width:9px; height:5px; border-left:2px solid currentColor; border-bottom:2px solid currentColor; transform:translateY(-1px) rotate(-45deg); }
.del { border:0; background:transparent; color:var(--muted); width:24px; height:24px; border-radius:50%; display:grid; place-items:center; padding:0; opacity:0; transition:opacity .15s; }
.del svg { width:14px; height:14px; }
.del:hover { background:var(--hover); color:var(--red); opacity:1 !important; }
.del:focus-visible { opacity:1; }
@media (hover:none) { .del { opacity:.55; } }

/* ---------- Schedule ---------- */
.schedhead { display:flex; align-items:flex-start; gap:12px; margin-bottom:4px; }
.schedhead .lane { flex:1; min-height:38px; padding:3px 8px; }
.schedhead .planbtn { margin-left:auto; flex:none; }
.lane .lab { font-family:var(--hand); font-size:21px; color:var(--muted); margin-right:2px; }
.planbtn { font-family:var(--hand); font-size:20px; font-weight:600; height:34px; padding:0 12px; white-space:nowrap; }
.grid { position:relative; margin:16px 4px 0 58px; }
.hour { position:absolute; left:0; right:0; border-top:1px solid var(--line); pointer-events:none; }
.hour span { position:absolute; left:-56px; top:-9px; width:48px; text-align:right; font-size:12px; color:var(--muted); }
.hour.midnight { border-top-style:dashed; }
.hour.nolabel span { visibility:hidden; }
.offzone { position:absolute; left:0; right:0; background:var(--off); pointer-events:none; }
.band { position:absolute; left:-58px; right:0; display:flex; align-items:center; gap:10px; padding:0 10px; border:1px dashed var(--line); border-radius:4px; background:repeating-linear-gradient(135deg, transparent 0 6px, var(--chip) 6px 7px); color:var(--muted); font-size:12.5px; text-align:left; z-index:2; }
.band:hover { color:var(--ink); border-color:var(--muted); }
.band .ic { margin-left:auto; }
.hidebtn { position:absolute; left:-56px; width:48px; text-align:right; border:0; background:transparent; color:var(--muted); font-size:11px; text-decoration:underline; padding:0; z-index:2; }
.past { position:absolute; left:0; right:0; top:0; background:var(--past); pointer-events:none; z-index:1; }
.now { position:absolute; left:-4px; right:0; border-top:2px solid var(--red); z-index:6; pointer-events:none; }
.now::before { content:''; position:absolute; left:-4px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--red); }
.now span { position:absolute; left:-54px; top:-10px; width:46px; text-align:right; font-size:12px; font-weight:700; color:var(--red); background:var(--panel); }
body[data-layout="phone"] .now span { background:var(--bg); }
.dueflag { position:absolute; left:0; right:0; border-top:2px dashed var(--red); z-index:5; pointer-events:none; }
.dueflag span { position:absolute; right:4px; top:-24px; font-family:var(--hand); font-size:19px; color:var(--red); background:var(--panel); padding:0 4px; line-height:1.15; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
body[data-layout="phone"] .dueflag span { background:var(--bg); }

.block {
  position:absolute; padding:5px 30px 5px 32px; font-size:13px; line-height:1.3; overflow:hidden; cursor:grab; z-index:3;
  background:color-mix(in srgb, var(--cat) var(--fill), var(--card)); border-radius:3px 10px 4px 9px;
  touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.block.nocb { padding-left:10px; }
.block.nodrag { cursor:pointer; }
.block .cb { position:absolute; left:9px; top:7px; width:15px; height:15px; }
.block .bt { font-weight:700; display:flex; align-items:center; gap:5px; min-width:0; }
.block .tt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.block .bm { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.block .ic { color:var(--muted); }
.block .del { position:absolute; top:3px; right:3px; width:22px; height:22px; }
.block:hover .del { opacity:.75; }
.block.short { display:flex; align-items:center; gap:8px; padding-top:2px; padding-bottom:2px; }
.block.short .cb { top:50%; margin-top:-7.5px; }
.block.short .del { top:50%; margin-top:-11px; }
.block.done { opacity:.55; }
.block.done .tt { text-decoration:line-through; }
.block.dragging { opacity:.3; }
.block.tentative { background:color-mix(in srgb, var(--cat) 9%, var(--card)); border:1.5px dashed var(--cat); }
.block.open { background:repeating-linear-gradient(135deg, transparent 0 7px, var(--chip) 7px 8px); border:1px dashed var(--line); z-index:2; color:var(--muted); }
.block.open .bt { font-weight:500; }
.block.skipped { background:transparent; border:1.5px dashed var(--muted); opacity:.6; }
.block.skipped .tt { text-decoration:line-through; }
.block.missed { box-shadow:inset 0 0 0 1.5px var(--red); }
.block.missed .bm { color:var(--red); }
.block .resize { position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize; touch-action:none; }
.block .resize::after { content:''; position:absolute; left:50%; bottom:2px; width:22px; height:3px; margin-left:-11px; border-radius:2px; background:var(--muted); opacity:0; transition:opacity .15s; }
.block:hover .resize::after { opacity:.6; }
.ghost { position:absolute; left:4px; right:4px; border:2px dashed var(--accent); border-radius:6px; background:color-mix(in srgb, var(--accent) 10%, transparent); z-index:7; pointer-events:none; font-size:12px; font-weight:700; color:var(--accent); padding:3px 10px; }
.drag-clone { position:fixed; z-index:500; pointer-events:none; padding:6px 12px; border-radius:6px; background:var(--card); color:var(--ink); border:1px solid var(--card-border); box-shadow:0 10px 24px rgba(0,0,0,.2); font-size:13px; font-weight:700; max-width:240px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transform:rotate(-1.5deg); }
.drop-on { background-color:color-mix(in srgb, var(--accent) 8%, transparent) !important; outline:2px dashed var(--accent); outline-offset:3px; border-radius:8px; }

/* ---------- Tasks ---------- */
.quickadd { display:flex; align-items:flex-start; gap:10px; border-bottom:1.5px solid var(--ink); padding:7px 2px; }
.quickadd:focus-within { border-color:var(--accent); }
.quickadd > svg { width:18px; height:18px; color:var(--muted); flex:none; margin-top:3px; }
.quickadd textarea { flex:1; border:0; background:transparent; font-size:16px; line-height:1.4; outline:none; min-width:0; resize:none; height:24px; max-height:180px; overflow:auto; }
.quickadd textarea::placeholder { color:var(--muted); }
.quickadd .busy { display:none; font-family:var(--hand); font-size:21px; font-weight:600; color:var(--accent); white-space:nowrap; }
.quickadd.is-busy .busy { display:block; }
.quickadd.is-busy textarea { opacity:.45; }
.pill { border:1px solid var(--card-border); background:var(--card); border-radius:999px; padding:3px 12px; font-size:12.5px; }
.pill:hover { background:var(--hover); }
.pill.primary { border-color:var(--ink); font-weight:700; }
.filters { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 2px; }
.filters button { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--card-border); background:transparent; border-radius:999px; padding:3px 11px; font-size:12.5px; color:var(--muted); }
.filters button i { width:8px; height:8px; border-radius:50%; background:var(--cat); }
.filters button[aria-pressed="true"] { background:var(--card); color:var(--ink); border-color:var(--ink); }
.gh { display:flex; justify-content:space-between; align-items:baseline; font-family:var(--hand); font-size:24px; font-weight:600; margin:16px 0 6px; line-height:1.1; }
.gh.red { color:var(--red); }
.gh .count { font-family:var(--body); font-size:12px; color:var(--muted); font-weight:400; }
.gh button { border:0; background:transparent; font:inherit; display:flex; justify-content:space-between; width:100%; align-items:baseline; padding:0; }
.check-row { display:flex; align-items:center; gap:10px; padding:5px 2px; border-bottom:1px dashed var(--line); cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.check-row .t { flex:1; min-width:0; }
.check-row .r { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); white-space:nowrap; }
.check-row .r span { display:inline-flex; align-items:center; gap:3px; }
.check-row.done .t { text-decoration:line-through; color:var(--muted); }
.check-row.dragging { opacity:.35; }
.check-row:hover .del { opacity:.75; }
.lane { display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:46px; padding:8px; border:1.5px dashed var(--line); border-radius:6px; }
.lane .empty { font-size:12.5px; color:var(--muted); }
.chip { display:inline-flex; align-items:center; gap:8px; padding:4px 4px 4px 9px; border:1px solid var(--card-border); background:var(--card); border-radius:6px; font-size:13px; cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.chip .dot { width:7px; height:7px; border-radius:50%; background:var(--cat); }
.chip .from { font-size:11.5px; color:var(--red); }
.chip.done span { text-decoration:line-through; color:var(--muted); }
.chip.dragging { opacity:.35; }
.chip .del { width:20px; height:20px; }
.chip:hover .del { opacity:.75; }
.card {
  position:relative; display:grid; grid-template-columns:17px 1fr auto; gap:11px; align-items:start; padding:10px 12px 10px; margin-bottom:8px;
  border:1px solid var(--card-border); border-radius:6px; background:var(--card);
  cursor:grab; touch-action:pan-y; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}
.card .cb { margin-top:2px; }
.card .t { font-weight:500; }
.card .t i { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--cat); margin-right:7px; vertical-align:1px; }
.catdot { display:inline-block; width:11px; height:11px; border-radius:50%; background:var(--cat); border:0; padding:0; margin-right:8px; vertical-align:0; }
.catdot:hover, .catdot:focus-visible { box-shadow:0 0 0 3px color-mix(in srgb, var(--cat) 35%, transparent); }
.catpick { display:flex; flex-wrap:wrap; gap:6px; }
.catpick button { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--card-border); background:var(--card); border-radius:999px; padding:3px 10px; font-size:12.5px; }
.catpick button i { width:8px; height:8px; border-radius:50%; background:var(--cat); }
.catpick button[aria-pressed="true"] { border-color:var(--ink); font-weight:700; }
.catpick input { flex:1 1 100%; border:1px solid var(--card-border); background:var(--card); border-radius:6px; padding:4px 8px; font-size:13px; margin-top:4px; }
.card .m { font-size:13px; color:var(--muted); margin-top:1px; }
.card .e { font-size:12px; color:var(--muted); margin-top:3px; padding-right:22px; }

  }
  return out;
}
function planTarget() {
  if (ui.sel < TODAY) return null;
  if (ui.sel === TODAY && nowMin() >= 1260) return addDays(TODAY, 1);
  return ui.sel;
}
function planLabel() {
  const t = planTarget();
  if (!t) return null;
  const n = diffDays(TODAY, t);
  if (n === 0) return 'Plan today';
  if (n === 1) return 'Plan tomorrow';
  if (n < 7) return `Plan ${DAYS[dow(t)]}`;
  const d = toDate(t);
  return `Plan ${MONTHS[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}
function runPlan() {
  const date = planTarget();

  ui.sel = date;
  const snap = snapshot();
  const { placed, lifted } = planDay(date);
  renderAll();
  const undo = [['Undo', () => restore(snap)]];
  if (placed.length) toast(`Penciled in ${placed.length} task${placed.length > 1 ? 's' : ''} for ${relWord(date)}.${lifted ? ' Rearranged anything you hadn’t pinned.' : ''}`, undo, 7000);
  else toast(`Nothing else fits in the free time ${relWord(date)}.`, lifted ? undo : []);
}

/* ================= Timeline geometry ================= */
function computeSegs() {
  const bl = blocksFor(ui.sel);
  const any = (a, b) => bl.some(x => x.start < b && x.start + x.dur > a);
  const today = ui.sel === TODAY, n = nowMin();
  const earlyForced = any(D0, wakeM()) || (today && n >= D0 && n < wakeM());
  const lateForced = any(bedM(), D3) || (today && n >= bedM() - 120);
  SEG = [
    { id:'early', from:D0, to:wakeM(), open:ui.early || earlyForced, forced:earlyForced },
    { id:'core', from:wakeM(), to:bedM(), open:true },
    { id:'late', from:bedM(), to:D3, open:ui.late || lateForced, forced:lateForced },
  ].filter(x => x.to > x.from);
}
const segH = s => s.open ? (s.to - s.from) / 60 * HOUR : BAND;
function yOf(m) {
  let y = 0;
  for (let i = 0; i < SEG.length; i++) {
    const s = SEG[i];
    if (m <= s.to || i === SEG.length - 1) {
      if (m <= s.from) return y;
      const mm = Math.min(m, s.to);
      return y + (s.open ? (mm - s.from) / 60 * HOUR : BAND * (mm - s.from) / (s.to - s.from));
    }
    y += segH(s);
  }
  return y;
}
function yToMin(y) {
  let acc = 0;
  for (let i = 0; i < SEG.length; i++) {
    const s = SEG[i], h = segH(s);
    if (y < acc + h || i === SEG.length - 1) {
      const local = Math.max(0, Math.min(h, y - acc));
      if (s.open) return s.from + local / HOUR * 60;
      return s.id === 'early' ? wakeM() : bedM();
    }
    acc += h;
  }
  return wakeM();
}
function clampMinute(m, dur) {
  m = Math.round(m / SNAP) * SNAP;
  let lo = D0;
  if (ui.sel === TODAY) lo = Math.max(lo, Math.ceil(nowMin() / SNAP) * SNAP);
  const se = SEG.find(x => x.id === 'early'), sl = SEG.find(x => x.id === 'late');
  if (se && !se.open) lo = Math.max(lo, wakeM());
  const hi = (sl && !sl.open ? bedM() : D3) - dur;
  return Math.max(lo, Math.min(hi, m));
}

/* ================= Rendering ================= */
function currentMode() {
  const a = S.settings.appearance;
  if (a === 'day' || a === 'night') return a;
  const m = nowMin() % 1440;
  return m >= 1200 || m < 480 ? 'night' : 'day';
}
function weekStartOf(date) { return addDays(date, -((dow(date) - S.settings.weekStart + 7) % 7)); }
function weekDates() { const ws = weekStartOf(ui.sel); return [0, 1, 2, 3, 4, 5, 6].map(k => addDays(ws, k)); }
function todayOnScreen() {
  if (ui.view === 'day') return ui.sel === TODAY;
  if (ui.view === 'week') return weekDates().includes(TODAY);
  return ui.sel.slice(0, 7) === TODAY.slice(0, 7);
}
function goDay(date) { ui.sel = date; ui.view = 'day'; ui.open = null; renderAll(); }
function bindDateClicks(root) {

}

function nextDeadline() {
  const fromKey = ui.sel === TODAY ? nowKey() : ui.sel + '0000';
  const due = S.items.filter(i => i.kind === 'task' && !i.done && i.due)
    .map(i => ({ i, k:dueKey(i.due) })).filter(x => x.k >= fromKey).sort((a, b) => a.k < b.k ? -1 : 1);
  if (!due.length) return null;
  const first = due[0];
  const names = due.filter(x => x.k === first.k).map(x => x.i.short || x.i.title);
  const d = first.i.due;
  return `${joinAnd(names)}, ${relWord(d.date)}${d.time != null ? ' at ' + fmtTime(d.time) : ''}.`;
}

function renderTabs() {

const fmtHM = m => { m = Math.round(m / 15) * 15; const h = Math.floor(m / 60), r = m % 60; return h ? `${h}h${r ? ' ' + r + 'm' : ''}` : `${r}m`; };
function remainingMin(i) {
  const base = i.est ? (i.est[0] + i.est[1]) / 2 : 30;
  const st = i.steps || [];
  return st.length ? base * (1 - st.filter(x => x.done).length / st.length) : base;
}
function capacityWarning() {
  const now = nowMin();
  const due = S.items.filter(i => i.kind === 'task' && !i.done && i.due && !isOverdue(i)).sort((a, b) => dueKey(a.due) < dueKey(b.due) ? -1 : 1);
  const seen = new Set();
  for (const d of due) {
    const k = dueKey(d.due);
    if (seen.has(k) || diffDays(TODAY, d.due.date) > 6) continue;
    seen.add(k);
    const group = due.filter(x => dueKey(x.due) <= k);
    const work = group.reduce((sum, x) => sum + remainingMin(x), 0);
    let free = 0;
    for (let day = TODAY, g = 0; day <= d.due.date && g < 8; day = addDays(day, 1), g++) {
      for (const [a, b] of slotsFor(day)) {
        const lim = day === d.due.date && d.due.time != null ? Math.min(b, d.due.time) : b;
        if (lim > a) free += lim - a;
      }
    }
    free += S.oneoffs.filter(o => o.itemId && group.some(x => x.id === o.itemId) && (o.date > TODAY || (o.date === TODAY && o.start >= now))).reduce((sum, o) => sum + o.dur, 0);
    const ratio = work / Math.max(free, 1);
    if (ratio > 0.5) {
      const names = joinAnd(due.filter(x => dueKey(x.due) === k).map(x => x.short || x.title));
      const when = `${relWord(d.due.date)}${d.due.time != null ? ' at ' + fmtTime(d.due.time) : ''}`;
      return `${ratio > 0.8 ? 'Tight' : 'Heads up'}: about ${fmtHM(work)} of work is due by ${when} (${names}), and you have about ${fmtHM(free)} of free time before then.`;
    }
  }
  return null;
}

function layoutCols(list) {
  const sorted = [...list].sort((a, b) => a.start - b.start || b.dur - a.dur);
  const clusters = []; let cur = [], end = -1;
  for (const b of sorted) {
    if (cur.length && b.start >= end) { clusters.push(cur); cur = []; end = -1; }
    cur.push(b); end = Math.max(end, b.start + b.dur);
  }
  if (cur.length) clusters.push(cur);
  for (const c of clusters) {
    const cols = [];
    for (const b of c) {
      let i = cols.findIndex(e => e <= b.start);
      if (i < 0) { i = cols.length; cols.push(0); }
      cols[i] = b.start + b.dur; b.col = i;
    }
    c.forEach(b => b.ncol = cols.length);
  }
}

function blockEl(b) {

  if (!noCb) d.querySelector('.cb').onclick = () => toggleBlock(b);

    : b.src === 'rule' ? 'Skip this day' : b.itemId ? 'Back to the list' : 'Remove';
  const x = delBtn(delLabel);
  x.onclick = () => removeBlock(b);
  d.appendChild(x);
  const payload = { type:'block', src:b.src, ref:b.src === 'oneoff' ? b.o : b.src === 'rule' ? b.r : b.c,
    key:b.key, dur:b.dur, title:b.title, start:b.start, b, noDrag };
  d.addEventListener('pointerdown', e => beginPointer(e, payload, d));

  return d;

function renderTasks() {
  const tasks = S.items.filter(i => i.kind === 'task');
  const openN = tasks.filter(t => !t.done).length;
  $('#handle').innerHTML = `<span class="grab"></span><span>${openN} tasks</span>`;
  const F = [['all', 'All'], ...S.cats.map(k => [k.id, k.name])];
  $('#filters').innerHTML = F.map(([k, l]) => `<button data-f="${k}" aria-pressed="${ui.filter === k}" style="--cat:${catVar(k)}">${k !== 'all' ? '<i></i>' : ''}${l}</button>`).join('');
  $('#filters').querySelectorAll('button').forEach(b => b.onclick = () => { ui.filter = ui.filter === b.dataset.f ? 'all' : b.dataset.f; renderTasks(); });

  const root = $('#taskList');
  root.innerHTML = '';
  root.appendChild(checklistEl(ui.sel));

  const pass = t => ui.filter === 'all' || t.cat === ui.filter;
  const order = ['overdue', 'near', 'week', 'soon', 'waiting', 'decide', 'ongoing'];
  const byKey = (a, b) => (a.due ? dueKey(a.due) : 'z') < (b.due ? dueKey(b.due) : 'z') ? -1 : (a.due ? dueKey(a.due) : 'z') > (b.due ? dueKey(b.due) : 'z') ? 1 : 0;
  for (const w of order) {
    const its = tasks.filter(t => effWin(t) === w && pass(t)).sort(byKey);
    if (!its.length) continue;
    const g = document.createElement('div');
    g.innerHTML = `<h2 class="gh${w === 'overdue' ? ' red' : ''}"><span>${WIN_LABEL[w]}</span><span class="count">${its.length}</span></h2>`;
    if (w === 'waiting') {
      const conds = S.conditions.filter(c => its.some(t => t.waitOn === c.id));
      for (const c of conds) {
        const row = document.createElement('div');
        row.className = 'cond';
        row.innerHTML = c.snoozed === TODAY
          ? `<span class="cq">${esc(c.q)}</span><span class="snz">Asking again tomorrow</span>`
          : `<span class="cq">${esc(c.q)}</span><button class="pill" data-y>Yes</button><button class="pill" data-n>Not yet</button>`;
        if (c.snoozed !== TODAY) {
          row.querySelector('[data-y]').onclick = () => resolveCondition(c);
          row.querySelector('[data-n]').onclick = () => { c.snoozed = TODAY; renderTasks(); };
        }
        g.appendChild(row);
        its.filter(t => t.waitOn === c.id).forEach(it => g.appendChild(cardEl(it)));
      }
      its.filter(t => !conds.some(c => c.id === t.waitOn)).forEach(it => g.appendChild(cardEl(it)));
    } else its.forEach(it => g.appendChild(cardEl(it)));
    root.appendChild(g);
  }
  const done = tasks.filter(t => t.done && pass(t));
  if (done.length) {
    const g = document.createElement('div');
    g.innerHTML = `<h2 class="gh"><button aria-expanded="${ui.showDone}"><span>Done</span><span class="count">${done.length}, ${ui.showDone ? 'hide' : 'show'}</span></button></h2>`;
    g.querySelector('button').onclick = () => { ui.showDone = !ui.showDone; renderTasks(); };
    if (ui.showDone) done.forEach(it => g.appendChild(cardEl(it)));
    root.appendChild(g);
  }
}

function cardEl(it) {
  const d = document.createElement('div');
  const w = effWin(it);
  const canDrag = !['waiting', 'decide'].includes(it.win) && !it.done;
  const isOpen = ui.open === it.id;
  d.className = 'card' + (it.win === 'waiting' ? ' waiting' : '') + (it.done ? ' done' : '') + (canDrag ? '' : ' static')
    + (ui.fresh.has(it.id) ? ' fresh' : '') + (w === 'overdue' ? ' overdue' : '') + (isOpen ? ' open' : '');
  d.dataset.id = it.id;
  d.style.setProperty('--cat', catVar(it.cat));
  const sc = schedOf(it);
  const bits = [];
  if (sc && !it.done) bits.push(`<span class="when">${sc.start == null ? 'Sometime ' + relWord(sc.date) : cap(relWord(sc.date)) + ' ' + fmtTime(sc.start)}</span>`);
  else if (it.est) bits.push(it.session ? `${fmtDur(it.est[0])} sessions` : `About ${fmtDur(...it.est)}`);
  if (it.steps && it.steps.length) bits.push(`${it.steps.filter(s => s.done).length} of ${it.steps.length} steps`);
  if (it.notes) bits.push('Has notes');
  let right = '';
  if (it.win === 'decide') right = `<div class="decide"><button data-yes>Yes</button><button data-no>No</button></div>`;
  else if (it.due) {
    const n = diffDays(TODAY, it.due.date);
    const cls = it.done ? '' : w === 'overdue' ? 'over' : n <= 1 ? 'urgent' : n <= 6 ? 'soon' : '';
    right = `<span class="due ${cls}">${w === 'overdue' ? 'Was due' : 'Due'} ${dueLabel(it.due)}</span>`;
  }
  const left = it.win === 'decide' ? '<span class="q" aria-hidden="true">?</span>' : `<button class="cb" role="checkbox" aria-checked="${!!it.done}" aria-label="Done: ${esc(it.title)}"></button>`;
  d.innerHTML = `${left}<div><div class="t"><button class="catdot" aria-label="Category: ${esc(catName(it.cat))}. Change it" title="${esc(catName(it.cat))}"></button>${esc(it.title)}</div>${it.meta ? `<div class="m">${esc(it.meta)}</div>` : ''}${bits.length ? `<div class="e">${bits.join('. ')}</div>` : ''}</div>${right}`;
  if (isOpen) d.appendChild(detailsEl(it));
  const cb = d.querySelector(':scope > .cb');
  if (cb) cb.onclick = () => toggleTask(it);
  const dot = d.querySelector('.catdot');
  dot.onclick = () => openCatPicker(it, dot);
  if (it.win === 'decide') {
    d.querySelector('[data-yes]').onclick = () => resolveDecision(it, true);
    d.querySelector('[data-no]').onclick = () => resolveDecision(it, false);
  }
  const tr = delBtn(`Delete task: ${it.title}`, 'trash', 'trash');
  tr.onclick = () => deleteItem(it);
  d.appendChild(tr);
  d.addEventListener('pointerdown', e => beginPointer(e, { type:'task', itemId:it.id, title:it.title, noDrag:!canDrag }, d));
  return d;
}

function detailsEl(it) {
  const box = document.createElement('div');
  box.className = 'details';
  const steps = it.steps || [];
  box.innerHTML = `<div class="lab">Steps</div><div class="steps"></div><input class="addstep" placeholder="Add a step and press Enter"><div class="lab">Notes</div><textarea class="notes" placeholder="Links, materials, anything else">${esc(it.notes || '')}</textarea>`;
  const list = box.querySelector('.steps');
  steps.forEach((s, k) => {
    const row = document.createElement('div');
    row.className = 'step' + (s.done ? ' done' : '');
    row.innerHTML = `<button class="cb" role="checkbox" aria-checked="${!!s.done}" aria-label="Done: ${esc(s.t)}"></button><span>${esc(s.t)}</span>`;
    row.querySelector('.cb').onclick = () => { s.done = !s.done; renderAll(); };
    const x = delBtn(`Remove step: ${s.t}`);
    x.onclick = () => { steps.splice(k, 1); renderAll(); };
    row.appendChild(x);
    list.appendChild(row);
  });
  const add = box.querySelector('.addstep');
  add.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = add.value.trim();
    if (!v) return;
    it.steps = it.steps || [];
    it.steps.push({ t:v });
    renderAll();
    const again = document.querySelector(`.card[data-id="${it.id}"] .addstep`);
    if (again) again.focus();
  });
  box.querySelector('.notes').addEventListener('input', e => { it.notes = e.target.value; });
  return box;
}

/* ---------- Week / month / rail ---------- */
const WK_H = 44;
function dayAgenda(date) {
  const out = [];
  S.items.filter(i => i.kind === 'task' && i.due && i.due.date === date && !i.done)
    .forEach(i => out.push({ k:i.due.time == null ? 1439 : i.due.time, due:true, text:`Due${i.due.time != null ? ' ' + fmtTime(i.due.time) : ''}: ${cap(i.short || i.title)}` }));
  S.oneoffs.filter(o => o.date === date && !o.itemId && o.kind !== 'open')
    .forEach(o => out.push({ k:o.start, cat:o.cat, text:`${fmtTime(o.start)} ${o.title}${o.kind === 'tentative' ? ' (roughly)' : ''}` }));
  S.classes.filter(c => c.ex[date] === 'skip' && c.days.includes(dow(date)))
    .forEach(c => out.push({ k:c.start, cat:'class', text:`Skipping ${classTitle(c)}` }));
  return out.sort((a, b) => a.k - b.k);
}
function dayLabel(d) {
  const n = diffDays(TODAY, d), dd = toDate(d);
  const name = n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : DAYS[dd.getDay()];
  return `${name}, ${MONTHS[dd.getMonth()].slice(0, 3)} ${dd.getDate()}`;
}
function agendaHTML(dates, emptyText) {
  const days = dates.map(d => ({ d, items:dayAgenda(d) })).filter(x => x.items.length);
  if (!days.length) return `<div class="cu-empty">${emptyText}</div>`;
  return days.map(({ d, items }) => `<div class="cu-day" data-date="${d}" role="button" tabindex="0" aria-label="Open ${longDate(d)}"><div class="cu-date">${dayLabel(d)}</div>${items.map(x => `<div class="cu-item${x.due ? ' is-due' : ''}" style="--cat:${catVar(x.cat)}">${x.due ? '' : '<i></i>'}<span>${esc(x.text)}</span></div>`).join('')}</div>`).join('');
}

function renderRail() {
  const r = $('#rail');
  if (ui.layout !== 'wide') { r.innerHTML = ''; return; }
  const d = toDate(ui.sel), mo = d.getMonth();
  const start = weekStartOf(toStr(new Date(d.getFullYear(), mo, 1)));
  const cells = [];
  for (let k = 0; k < 42; k++) {
    const dd = addDays(start, k);
    if (k % 7 === 0 && k >= 28 && toDate(dd).getMonth() !== mo) break;
    cells.push(dd);
  }
  const heads = [0, 1, 2, 3, 4, 5, 6].map(k => `<span class="mh">${DAYS[(S.settings.weekStart + k) % 7][0]}</span>`).join('');
  const hasDue = date => S.items.some(i => i.kind === 'task' && !i.done && i.due && i.due.date === date);
  const mini = cells.map(dd => `<button data-date="${dd}" class="${dd === TODAY ? 'is-today ' : ''}${dd === ui.sel ? 'sel ' : ''}${toDate(dd).getMonth() !== mo ? 'other' : ''}" aria-label="${longDate(dd)}">${toDate(dd).getDate()}${hasDue(dd) ? '<i></i>' : ''}</button>`).join('');
  const next = [...Array(10)].map((_, k) => addDays(TODAY, k));
  r.innerHTML = `<div class="rail-box"><div class="rail-h">${MONTHS[mo]}</div><div class="mini">${heads}${mini}</div></div>
    <div class="rail-box"><div class="rail-h">Coming up</div>${agendaHTML(next, 'Nothing coming up in the next 10 days.')}</div>`;
  bindDateClicks(r);
}

function weekCardHTML(d) {
  const rows = [];
  S.items.filter(i => i.kind === 'task' && i.due && i.due.date === d && !i.done)
    .forEach(i => rows.push({ k:i.due.time == null ? 1439 : i.due.time, h:`<div class="wk-row due"><span class="tm">${i.due.time != null ? fmtTime(i.due.time) : 'End of day'}</span><span>Due: ${esc(cap(i.short || i.title))}</span></div>` }));
  blocksFor(d).filter(b => b.kind !== 'open' && !b.recurring)
    .forEach(b => rows.push({ k:b.start, h:`<div class="wk-row ${b.kind}" style="--cat:${catVar(b.cat)}"><span class="tm">${fmtTime(b.start)}</span><i></i><span>${esc(b.title)}</span></div>` }));
  S.sometime.filter(s => s.date === d && item(s.itemId)).forEach(s => {
    const it = item(s.itemId);
    rows.push({ k:2000, h:`<div class="wk-row" style="--cat:${catVar(it.cat)}"><span class="tm">Sometime</span><i></i><span>${esc(it.title)}</span></div>` });
  });
  rows.sort((a, b) => a.k - b.k);
  const dd = toDate(d);
  return `<div class="wk-card${d === TODAY ? ' is-today' : ''}" data-date="${d}" role="button" tabindex="0" aria-label="Open ${longDate(d)}"><div class="wk-card-h"><b>${DAYS[dd.getDay()]}</b><span>${MONTHS[dd.getMonth()].slice(0, 3)} ${dd.getDate()}${d === TODAY ? ', today' : ''}</span></div>${rows.map(r => r.h).join('') || '<div class="wk-none">Nothing scheduled</div>'}</div>`;
}

function renderWeek() {
  const v = $('#weekView');
  const dates = weekDates();
  if (ui.layout === 'phone' && ui.phoneWeek === 'stack') {
    v.innerHTML = `<div class="wk-stack">${dates.map(weekCardHTML).join('')}</div>`;
    bindDateClicks(v);
    return;
  }
  const per = dates.map(d => blocksFor(d).filter(b => b.kind !== 'open'));
  let lo = wakeM(), hi = bedM();
  per.flat().forEach(b => { lo = Math.min(lo, b.start); hi = Math.max(hi, b.start + b.dur); });
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  const y = m => (m - lo) / 60 * WK_H, H = y(hi);
  const heads = dates.map(d => `<button class="wk-dh${d === TODAY ? ' is-today' : ''}" data-date="${d}" aria-label="Open ${longDate(d)}"><span>${SHORT_DAYS[dow(d)]}</span><b>${toDate(d).getDate()}</b></button>`).join('');
  const allday = dates.map(d => {
    const dues = S.items.filter(i => i.kind === 'task' && i.due && i.due.date === d && !i.done);
    const st = S.sometime.filter(s => s.date === d && item(s.itemId));
    return `<div class="wk-ad" data-date="${d}">${dues.map(i => `<span class="d">Due${i.due.time != null ? ' ' + fmtTime(i.due.time) : ''}: ${esc(cap(i.short || i.title))}</span>`).join('')}${st.map(s => { const it = item(s.itemId); return `<span class="s" style="--cat:${catVar(it.cat)}">${esc(it.title)}</span>`; }).join('')}</div>`;
  }).join('');
  let gut = `<div class="wk-gut" style="height:${H}px">`;
  for (let m = lo + 60; m < hi; m += 60) gut += `<span style="top:${y(m)}px">${fmtTime(m)}</span>`;
  gut += '</div>';
  const cols = dates.map((d, k) => {
    const bl = per[k];
    layoutCols(bl);
    let h = '';
    for (let m = lo + 60; m < hi; m += 60) h += `<div class="wk-line" style="top:${y(m)}px"></div>`;
    S.items.filter(i => i.kind === 'task' && !i.done && i.due && i.due.date === d && i.due.time != null && i.due.time >= lo && i.due.time <= hi)
      .forEach(i => h += `<div class="wk-dueline" style="top:${y(i.due.time)}px"></div>`);
    bl.forEach(b => {
      const t = y(b.start), hh = Math.max(y(b.start + b.dur) - t - 2, 15);
      h += `<div class="wk-b ${b.kind}${b.done ? ' done' : ''}" style="--cat:${catVar(b.cat)};top:${t + 1}px;height:${hh}px;left:calc(${b.col / b.ncol * 100}% + 2px);width:calc(${100 / b.ncol}% - 4px)"><b>${esc(b.title)}</b>${hh > 28 ? `<span>${fmtRange(b.start, b.start + b.dur)}</span>` : ''}</div>`;
    });
    if (d === TODAY) { const n = nowMin(); if (n >= lo && n <= hi) h += `<div class="wk-now" style="top:${y(n)}px"></div>`; }
    return `<div class="wk-col${d === TODAY ? ' is-today' : ''}" data-date="${d}" role="button" tabindex="0" aria-label="Open ${longDate(d)}">${h}</div>`;
  }).join('');
  v.innerHTML = `<div class="wk-box" id="wkBox"><div class="wk-top"><div class="wk-corner"></div>${heads}<div class="wk-corner"></div>${allday}</div><div class="wk-body" style="height:${H}px">${gut}${cols}</div></div>`;
  bindDateClicks(v);
  if (dates.includes(TODAY)) $('#wkBox').scrollTop = Math.max(0, y(nowMin()) - 160);
}

function renderMonth() {
  const d = toDate(ui.sel), y = d.getFullYear(), mo = d.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo + 1, 0).getDate();
  const ws = S.settings.weekStart, off = (first.getDay() - ws + 7) % 7;
  const phone = ui.layout === 'phone';
  let html = [0, 1, 2, 3, 4, 5, 6].map(k => `<div class="mo-head">${SHORT_DAYS[(ws + k) % 7]}</div>`).join('');
  for (let i = 0; i < off; i++) html += '<div class="mo-cell blank"></div>';
  for (let n = 1; n <= days; n++) {
    const date = toStr(new Date(y, mo, n));
    const dues = S.items.filter(i => i.kind === 'task' && i.due && i.due.date === date);
    const evs = blocksFor(date).filter(b => b.src === 'oneoff' && b.kind !== 'open');
    let inner;
    if (phone) {
      const dots = [...dues.filter(i => !i.done).map(() => '<i class="is-due"></i>'), ...evs.map(b => `<i style="--cat:${catVar(b.cat)}"></i>`)].slice(0, 4).join('');
      inner = `<span class="n">${n}</span><div class="mo-dots">${dots}</div>`;
    } else {
      const ev = [];
      dues.forEach(i => ev.push(`<div class="ev due">Due: ${esc(cap(i.short || i.title))}</div>`));
      evs.forEach(b => ev.push(`<div class="ev" style="--cat:${catVar(b.cat)}"><i></i>${esc(b.title)}</div>`));
      S.items.filter(i => i.kind === 'routine' && i.repeat !== 'daily' && occurs(i, date)).forEach(i => ev.push(`<div class="ev quiet">${esc(i.title)}</div>`));
      inner = `<span class="n">${n}</span>${ev.join('')}`;
    }
    html += `<div class="mo-cell${date === TODAY ? ' is-today' : ''}" role="button" tabindex="0" data-date="${date}" aria-label="Open ${longDate(date)}">${inner}</div>`;
  }
  $('#monthGrid').innerHTML = html;
  const all = [...Array(days)].map((_, k) => toStr(new Date(y, mo, k + 1)));
  $('#agenda').innerHTML = phone ? `<div class="agenda"><h3>In ${MONTHS[mo]}</h3>${agendaHTML(all, 'Nothing on the calendar this month yet.')}</div>` : '';
  bindDateClicks($('#monthView'));
}

let lastViewKey = '';
function renderAll() {
  applyAttrs();
  renderHeader();
  renderRail();
  if (ui.view === 'day') { renderDay(); renderTasks(); }
  else if (ui.view === 'week') renderWeek();
  else renderMonth();
  const vk = ui.view + ui.layout + ui.phoneWeek;
  if (vk !== lastViewKey) {
    lastViewKey = vk;
    if (ui.layout === 'phone') {
      const m = $('#main');
      m.scrollTop = 0;
      if (ui.view === 'week') { const t = document.querySelector('.wk-card.is-today'); if (t) m.scrollTop = t.offsetTop - m.offsetTop - 8; }
      if (ui.view === 'day') requestAnimationFrame(scrollToNow);
    }
  }
  renderHarness();
  applyDrawer(false);
}

/* ================= Actions ================= */
function toggleTask(it) {
  it.done = !it.done;
  renderAll();
  if (it.done && it.est && it.est[0] !== it.est[1] && !it.session) {
    toast('Done. How long did it take?', [
      ['About as planned', () => toast('Noted.')],
      ['Longer', () => { it.took = 'longer'; toast('Noted. Similar tasks will get longer estimates.'); }],
      ['Shorter', () => { it.took = 'shorter'; toast('Noted. Similar tasks will get shorter estimates.'); }],
    ], 8000);
  }
}
function toggleRoutine(it, date) {
  if (it.doneOn[date]) delete it.doneOn[date]; else it.doneOn[date] = 1;
  renderAll();
}
function toggleBlock(b) {
  if (b.src === 'rule') toggleRoutine(item(b.itemId), ui.sel);
  else if (b.itemId) toggleTask(item(b.itemId));
  else { b.o.done = !b.o.done; renderAll(); }
}
function deleteItem(it) {
  const snap = snapshot();
  S.items = S.items.filter(i => i !== it);
  S.oneoffs = S.oneoffs.filter(o => o.itemId !== it.id);
  S.rules = S.rules.filter(r => r.itemId !== it.id);
  S.sometime = S.sometime.filter(s => s.itemId !== it.id);
  if (ui.open === it.id) ui.open = null;
  renderAll();
  toast(`Deleted “${it.title}”.`, [['Undo', () => restore(snap)]]);
}
function removeBlock(b) {
  const snap = snapshot();
  const undo = ['Undo', () => restore(snap)];
  if (b.src === 'class') { toggleSkipClass(b.c, ui.sel); toast(b.kind === 'skipped' ? 'Not skipping it after all.' : `Skipping ${b.title} on ${relWord(ui.sel)}.`, [undo]); return; }
  if (b.src === 'rule') {
    b.r.ex[ui.sel] = 'skip';
    renderAll();
    toast(`Skipped ${b.title} for this day.`, [['Every day instead', () => { S = JSON.parse(snap); S.rules = S.rules.filter(r => r.id !== b.r.id); renderAll(); toast('Off the schedule on every day. It’s still in your checklist.'); }], undo]);
    return;
  }
  S.oneoffs = S.oneoffs.filter(o => o.id !== b.o.id);
  renderAll();
  toast(b.itemId ? 'Back on your list.' : `Removed “${b.title}”.`, [undo]);
}
function resolveDecision(it, yes) {
  const snap = snapshot();
  S.items = S.items.filter(i => i !== it);
  if (yes && it.yes && it.yes.title) {
    S.items.push({ id:it.id + '-y', kind:'task', win:it.yes.win || 'soon', title:it.yes.title, cat:it.cat });
    toast(`Moved “${it.yes.title}” to Soon.`, [['Undo', () => restore(snap)]]);
  } else if (yes && it.yes && it.yes.skipClass) {
    const c = S.classes.find(x => x.id === it.yes.skipClass.id);
    if (c) c.ex[it.yes.skipClass.date] = 'skip';
    toast(`Skipping ${c ? classTitle(c) : 'it'} on ${relWord(it.yes.skipClass.date)}. It’s marked on the schedule.`, [['Undo', () => restore(snap)]]);
  } else toast(yes ? 'Noted.' : 'Dropped it.', [['Undo', () => restore(snap)]]);
  renderAll();
}
function resolveCondition(c) {
  const snap = snapshot();
  const its = S.items.filter(i => i.waitOn === c.id);
  its.forEach(i => { i.win = 'soon'; delete i.waitOn; });
  S.conditions = S.conditions.filter(x => x !== c);
  renderAll();
  toast(`Moved ${joinAnd(its.map(i => i.title))} to Soon.`, [['Undo', () => restore(snap)]]);
}
function toggleSkipClass(c, date) {
  if (c.ex[date] === 'skip') delete c.ex[date]; else c.ex[date] = 'skip';
  renderAll();
}

/* ---------- Toast, popover, dialog ---------- */
function toast(msg, actions = [], ms = 4500) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  actions.forEach(([label, fn]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { t.remove(); fn(); };
    t.appendChild(b);
  });
  (ui.layout === 'phone' ? $('#device') : document.body).appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), ms);
}

function openPopover(b, el) {
  closePopover();
  const p = document.createElement('div');
  p.className = 'popover';
  p.setAttribute('role', 'dialog');
  p.setAttribute('aria-label', b.title);
  const lines = [`${cap(relWord(ui.sel))}, ${fmtRange(b.start, b.start + b.dur)}`];
  if (b.src === 'class') {
    if (b.c.name) lines.push(b.c.name);
    if (b.c.loc) lines.push(b.c.loc);
    lines.push(`Every ${daysWords(b.c.days)}`);
    if (b.c.gcal) lines.push('From your calendar file');
  }
  if (b.src === 'rule') lines.push(`Repeats ${repeatWords(item(b.itemId))}`);
  if (b.kind === 'tentative' && b.label) lines.push(b.label);
  if (b.src === 'oneoff' && b.o.gcal) { if (b.o.loc) lines.push(b.o.loc); lines.push('From your calendar file'); }
  if (b.itemId && b.src !== 'rule') {
    const it = item(b.itemId);
    if (it && it.meta) lines.push(it.meta);
    if (b.penciled) lines.push(`Penciled in by the planner${b.o.reason ? ': ' + b.o.reason.charAt(0).toLowerCase() + b.o.reason.slice(1) : ''}. It may move this if plans change.`);
    if (b.o.pinned) lines.push('Pinned by you, so the planner won’t move it.');
  }
  p.innerHTML = `<h3>${esc(b.title)}</h3>${lines.map(l => `<div class="pm">${esc(l)}</div>`).join('')}<div class="acts"></div>`;
  const acts = p.querySelector('.acts');
  const add = (label, fn, primary) => {
    const x = document.createElement('button');
    x.className = 'pill' + (primary ? ' primary' : '');
    x.textContent = label;
    x.onclick = () => { closePopover(); fn(); };
    acts.appendChild(x);
  };
  if (b.src === 'class') {
    add(b.kind === 'skipped' ? 'Not skipping' : 'Skip this one', () => toggleSkipClass(b.c, ui.sel));
    add('Edit', () => openClassDialog(b.c));
  } else if (b.src === 'rule') {
    add(b.done ? 'Mark not done' : 'Mark done', () => toggleBlock(b), true);
    add('Skip this day', () => removeBlock(b));
  } else {
    if (b.kind !== 'open') add(b.done ? 'Mark not done' : 'Mark done', () => toggleBlock(b), true);
    if (b.itemId) add(b.o.pinned ? 'Unpin' : 'Pin here', () => { b.o.pinned = !b.o.pinned; renderAll(); });
    add(b.itemId ? 'Back to the list' : 'Remove', () => removeBlock(b));
  }
  document.body.appendChild(p);
  const r = el.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let x, y;
  if (ui.layout === 'phone') {

/* ================= Drag and drop (mouse and touch) ================= */
function beginPointer(e, payload, el) {
  if (e.button !== 0 || drag) return;
  if (payload.type !== 'resize' && e.target.closest('button, input, textarea, a, .details')) return;
  const rect = el.getBoundingClientRect();
  drag = { payload, el, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, started:false,
    touch:e.pointerType !== 'mouse', offY:payload.type === 'block' ? Math.min(e.clientY - rect.top, 24) : 12 };
  if (drag.touch && !payload.noDrag) drag.timer = setTimeout(() => { if (drag && !drag.started) { navigator.vibrate && navigator.vibrate(12); startDrag(); } }, 280);
  window.addEventListener('pointermove', onPMove, { passive:false });
  window.addEventListener('pointerup', onPUp);
  window.addEventListener('pointercancel', cancelDrag);
}
document.addEventListener('touchmove', e => { if (drag && drag.started) e.preventDefault(); }, { passive:false });

function onPMove(e) {
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    const dist = Math.hypot(drag.x - drag.x0, drag.y - drag.y0);
    if (drag.touch || drag.payload.noDrag) { if (dist > 10) cancelDrag(); return; }
    if (dist < 5) return;
    startDrag();
  }
  e.preventDefault();
  updateDrag();
}

function dragDur(p) {
  if (p.type === 'task' || p.type === 'sometime') return defaultDur(item(p.itemId));
  if (p.type === 'routine') { const r = S.rules.find(x => x.itemId === p.itemId); return r ? r.dur : item(p.itemId).dur; }
  return p.dur;
}

function startDrag() {
  closePopover();
  drag.started = true;
  drag.dur = dragDur(drag.payload);
  document.body.classList.add('is-dragging');
  if (drag.payload.type !== 'resize') {
    drag.el.classList.add('dragging');
    const c = document.createElement('div');
    c.className = 'drag-clone';
    c.textContent = drag.payload.title;
    document.body.appendChild(c);
    drag.clone = c;
    if (ui.layout === 'phone' && drag.payload.type !== 'block' && ui.drawer !== 'peek') {
      drag.prevDrawer = ui.drawer;
      ui.drawer = 'peek';
      applyDrawer(true);
    }
  }
  drag.raf = requestAnimationFrame(autoScroll);
  updateDrag();
}

function clearTargets() {
  document.querySelectorAll('.drop-on').forEach(x => x.classList.remove('drop-on'));
  const gh = $('#ghost');
  if (gh) gh.remove();
}

function updateDrag() {
  const { x, y, payload } = drag;
  if (payload.type === 'resize') {
    computeSegs();
    const r = $('#grid').getBoundingClientRect();
    const end = Math.round(yToMin(y - r.top) / SNAP) * SNAP;
    const dur = Math.max(15, Math.min(D3 - payload.start, end - payload.start));
    drag.target = { kind:'resize', dur };
    const el = document.querySelector(`.block[data-key="${payload.key}"]`);
    if (el) {
      el.style.height = Math.max(yOf(payload.start + dur) - yOf(payload.start) - 3, 20) + 'px';
      el.querySelector('.bm').textContent = fmtRange(payload.start, payload.start + dur);
    }
    return;
  }
  drag.clone.style.left = (x + 14) + 'px';
  drag.clone.style.top = (y - 16) + 'px';
  clearTargets();
  drag.target = null;
  const under = document.elementFromPoint(x, y);
  if (!under) return;
  const band = under.closest('.band');
  if (band) {
    if (drag.bandHover !== band.dataset.band) {
      drag.bandHover = band.dataset.band;
      clearTimeout(drag.bandTimer);
      const which = band.dataset.band;
      drag.bandTimer = setTimeout(() => { if (drag) { ui[which] = true; renderDay(); updateDrag(); } }, 350);
    }
    return;
  }
  drag.bandHover = null;
  clearTimeout(drag.bandTimer);
  if (under.closest('#grid')) {
    const r = $('#grid').getBoundingClientRect();
    const m = clampMinute(yToMin(y - r.top - drag.offY), drag.dur);
    drag.target = { kind:'grid', m };
    const gh = document.createElement('div');
    gh.id = 'ghost'; gh.className = 'ghost';
    gh.style.top = (yOf(m) + 1) + 'px';
    gh.style.height = Math.max(yOf(m + drag.dur) - yOf(m) - 3, 20) + 'px';
    gh.textContent = fmtRange(m, m + drag.dur);
    $('#grid').appendChild(gh);
    return;
  }
  const some = under.closest('.sometime-drop');
  if (some && canSometime(payload)) { some.classList.add('drop-on'); drag.target = { kind:'sometime' }; return; }
  const tasks = under.closest('#tasks');
  if (tasks && (payload.type === 'block' || payload.type === 'sometime')) { tasks.classList.add('drop-on'); drag.target = { kind:'tasks' }; }
}

function canSometime(p) {
  if (p.type === 'task' || p.type === 'sometime') return true;
  return p.type === 'block' && p.src === 'oneoff' && !!p.ref.itemId;
}

function scroller() { return ui.layout === 'wide' ? document.scrollingElement : $('#main'); }
function autoScroll() {
  if (!drag || !drag.started) return;
  const sc = scroller();
  const r = sc === document.scrollingElement ? { top:0, bottom:innerHeight } : sc.getBoundingClientRect();
  const bottom = r.bottom - (ui.layout === 'phone' ? 64 : 0);
  const edge = 56;
  let dy = 0;
  if (drag.y < r.top + edge && drag.y > r.top - 40) dy = -Math.ceil((r.top + edge - drag.y) / 5);
  else if (drag.y > bottom - edge && drag.y < bottom) dy = Math.ceil((drag.y - (bottom - edge)) / 5);
  if (dy) { sc.scrollTop += dy; updateDrag(); }
  drag.raf = requestAnimationFrame(autoScroll);
}

function endDragUI() {
  clearTimeout(drag.timer); clearTimeout(drag.bandTimer); cancelAnimationFrame(drag.raf);
  if (drag.clone) drag.clone.remove();
  if (drag.el) drag.el.classList.remove('dragging');
  clearTargets();
  document.body.classList.remove('is-dragging');
  window.removeEventListener('pointermove', onPMove);
  window.removeEventListener('pointerup', onPUp);
  window.removeEventListener('pointercancel', cancelDrag);
  if (drag.prevDrawer) { ui.drawer = drag.prevDrawer; applyDrawer(true); }
}
function cancelDrag() {
  if (!drag) return;
  const wasResize = drag.started && drag.payload.type === 'resize';
  endDragUI();
  drag = null;
  if (wasResize) renderDay();
}
function onPUp() {
  if (!drag) return;
  const { started, target, payload, el } = drag;
  endDragUI();
  drag = null;
  if (started && target) doDrop(payload, target);
  else if (!started && payload.type === 'block') openPopover(payload.b, el);
  else if (!started && payload.type === 'task') { ui.open = ui.open === payload.itemId ? null : payload.itemId; renderTasks(); }
}

function doDrop(p, t) {
  const date = ui.sel;
  const snap = snapshot();
  const undo = ['Undo', () => restore(snap)];
  if (t.kind === 'resize') { p.ref.dur = t.dur; }
  else if (t.kind === 'grid') {
    const m = t.m;
    if (p.type === 'task' || p.type === 'sometime') {
      const it = item(p.itemId);
      const s = S.sometime.find(x => x.itemId === it.id);
      S.sometime = S.sometime.filter(x => x.itemId !== it.id);
      const o = S.oneoffs.find(x => x.itemId === it.id);
      if (o) { o.date = date; o.start = m; o.pinned = true; }
      else S.oneoffs.push({ id:uid(), itemId:it.id, date, start:m, dur:defaultDur(it), kind:'placed', pinned:true, from:s && s.from });
    } else if (p.type === 'routine') {
      const it = item(p.itemId);
      const r = S.rules.find(x => x.itemId === it.id);
      if (r) { r.start = m; delete r.ex[date]; }
      else S.rules.push({ id:uid(), itemId:it.id, start:m, dur:it.dur, ex:{} });
      toast(`${it.title} now repeats ${repeatWords(it)} at ${fmtTime(m)}.`, [undo]);
    } else if (p.src === 'oneoff') {
      const o = p.ref;
      o.start = m; o.date = date; o.pinned = true;
      if (o.kind === 'tentative') o.label = `Around ${fmtTime(m)}`;
    } else if (p.src === 'rule') {
      const r = p.ref;
      if (m === r.start) delete r.ex[date]; else r.ex[date] = m;
      toast('Moved for this day only.', [['Every day instead', () => { r.start = m; delete r.ex[date]; renderAll(); toast(`Moved to ${fmtTime(m)} on every day.`); }], undo]);
    }
  } else if (t.kind === 'sometime') {
    const id = p.type === 'block' ? p.ref.itemId : p.itemId;
    S.oneoffs = S.oneoffs.filter(o => o.itemId !== id);
    S.sometime = S.sometime.filter(s => s.itemId !== id);
    S.sometime.push({ itemId:id, date });
  } else if (t.kind === 'tasks') {
    if (p.type === 'sometime') { S.sometime = S.sometime.filter(s => s.itemId !== p.itemId); toast('Back on your list.', [undo]); }
    else if (p.src === 'oneoff') {
      S.oneoffs = S.oneoffs.filter(x => x !== p.ref);
      toast(p.ref.itemId ? 'Back on your list.' : `Removed “${p.ref.title}”.`, [undo]);
    } else if (p.src === 'rule') {
      const it = item(p.ref.itemId);
      S.rules = S.rules.filter(x => x !== p.ref);
      toast(`${it.title} is off the schedule. It’s still in your checklist.`, [undo]);
    }
  }
  renderAll();
}

/* ================= Phone drawer ================= */
function drawerHeights() {
  const scr = $('#screen').getBoundingClientRect(), top = $('#top').getBoundingClientRect();
  const max = Math.max(220, Math.round(scr.bottom - top.bottom - 4));
  return { peek:64, half:Math.min(max, Math.round(scr.height * 0.52)), max };
}
function applyDrawer(animate) {
  const t = $('#tasks');
  if (ui.layout !== 'phone' || ui.view !== 'day') { t.style.height = ''; $('#backdrop').hidden = true; return; }
  const hs = drawerHeights();
  t.style.transition = animate ? 'height .28s ease' : 'none';
  t.style.height = hs[ui.drawer] + 'px';
  $('#backdrop').hidden = ui.drawer === 'peek';
}
$('#backdrop').addEventListener('click', () => { ui.drawer = 'peek'; applyDrawer(true); });
$('#handle').addEventListener('pointerdown', e => {
  if (ui.layout !== 'phone') return;
  e.preventDefault();
  const t = $('#tasks'), hs = drawerHeights();
  const y0 = e.clientY, h0 = t.getBoundingClientRect().height;
  let moved = false;
  t.style.transition = 'none';
  const mv = ev => {
    const dy = y0 - ev.clientY;
    if (Math.abs(dy) > 5) moved = true;
    if (!moved) return;
    const h = Math.max(hs.peek, Math.min(hs.max, h0 + dy));
    t.style.height = h + 'px';
    $('#backdrop').hidden = h <= hs.peek + 4;
  };
  const up = () => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if (!moved) ui.drawer = ui.drawer === 'peek' ? 'half' : 'peek';
    else {
      const h = t.getBoundingClientRect().height;
      ui.drawer = ['peek', 'half', 'max'].reduce((best, k) => Math.abs(hs[k] - h) < Math.abs(hs[best] - h) ? k : best, 'peek');
    }
    applyDrawer(true);
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
});
$('#handle').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ui.drawer = ui.drawer === 'peek' ? 'half' : 'peek'; applyDrawer(true); } });
window.addEventListener('resize', () => applyDrawer(false));

/* ================= Quick add and the parser ================= */
function systemPrompt() {
  const dates = [];
  for (let i = 0; i < 14; i++) { const d = addDays(TODAY, i); dates.push(`${SHORT_DAYS[dow(d)]} ${d}`); }
  const classes = S.classes.map(c => `${classTitle(c)} ${c.days.map(d => SHORT_DAYS[d]).join('/')} ${toHM(c.start)}-${toHM(c.end)}`).join('; ');
  return `You turn quick notes into planner items for a college student. Today is ${DAYS[dow(TODAY)]} ${TODAY}, the time is ${toHM(nowMin())}.
Next 14 days: ${dates.join(', ')}.
Their weekly classes: ${classes}.

Reply with ONLY a JSON object, no prose and no code fences: {"items":[...]}
Each item has "type": "task", "routine", "event", or "class". Leave out any field that doesn't apply. Keep it compact.
Fields:
- title: short. Tasks start with a verb ("Get razor"). Keep names and course codes as written.
- meta: one short line of extra detail.
- cat: "class" (schoolwork), "errand" (buying, fixing, admin), "growth" (skills, projects, career), "life" (health, social, chores), "routine"${S.cats.filter(k => k.color).map(k => `, "${k.name.toLowerCase()}"`).join('')}. If the line has a #tag, use the tag word as cat.
- win (tasks): "near" = today or tomorrow, "week" = within about a week, "soon" = no rush, "ongoing" = open-ended skill building, "waiting" = depends on something that hasn't happened, "decide" = has "?", "maybe", "not sure", or needs a judgment call.
- due (tasks): {"date":"YYYY-MM-DD","time":"HH:MM"}, only if they gave a deadline. "before class" means that class's start time on that day. Leave out time if none was given.
- short: 2-4 word name for a deadline ("Math PSet 2").
- est: [low, high] minutes, an honest range. Readings and problem sets get wide ranges.
- sitting: minutes for one work session when the task is big.
- session: minutes per session for ongoing skill items.
- steps: array of short strings when a task clearly has separate parts.
- wait: for waiting tasks, the condition as a yes/no question ("Is the cold fully gone?").
- repeat (routines, classes): {"days":"daily"} or {"days":[0-6], "every":1 or 2}. 0 is Sunday.
- date (events): "YYYY-MM-DD". start, end: "HH:MM" 24-hour, only if given.
- loc: location if given.
- tentative: true when a time is approximate ("around 7?", "depends on friends").
Rules:
- Never invent a date, time, or deadline that wasn't given. Put vague timing in win instead.
- Times from 00:00 to 04:00 belong to the night of the given day.
- Fix obvious am/pm slips (going to sleep at "12:30pm" means 00:30).
- Split lines that contain several things. Skip headings, dates used only as headers, and filler.
- Habits and chores that repeat are routines. Courses with meeting times are classes.
- These are notes the student wrote to themselves, often messy. Remarks in parentheses, like "(no specific due date)", "(contingent)", "(daily thing)", "(near near future)", or "(judgment needed)", describe the item: use them to set fields, and leave them out of the title.
- A header line (like "Category: Homework", or a date such as "10/6 (Tuesday)" followed by a course code or "(before 2:00pm)") applies to the lines under it, for example as their due date and time. It is not an item itself.
- A plan for today written as times ("Dinner: around 7?", "Sleep by 12") becomes events for today; mark approximate ones tentative.`;
}

async function parseWithClaude(text) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, system:systemPrompt(), messages:[{ role:'user', content:text }] }),
  });
  if (!res.ok) { let detail = ''; try { detail = (await res.text()).slice(0, 120); } catch (e) {} throw new Error(`HTTP ${res.status} ${detail}`.trim()); }
  const data = await res.json();
  const raw = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  const clean = raw.replace(/```json|```/g, '').trim();
  const obj = JSON.parse(clean.slice(clean.indexOf('{'), clean.lastIndexOf('}') + 1));
  return Array.isArray(obj.items) ? obj.items : [];
}

function chunkText(text) {
  const paras = text.split(/\n\s*\n/).map(p => p.split('\n').map(l => l.trim()).filter(Boolean)).filter(p => p.length);
  const chunks = [];
  let cur = [];
  for (const p of paras) {
    for (let i = 0; i < p.length; i += 12) {
      const piece = p.slice(i, i + 12);
      if (cur.length + piece.length > 12 && cur.length) { chunks.push(cur.join('\n')); cur = []; }
      cur.push(...piece);
    }
  }
  if (cur.length) chunks.push(cur.join('\n'));
  return chunks;
}

async function parseAll(text) {
  const chunks = chunkText(text);
  const res = await Promise.allSettled(chunks.map(c => parseWithClaude(c)));
  const items = [], errors = [];
  let fellBack = 0;
  res.forEach((r, k) => {
    if (r.status === 'fulfilled') items.push(...r.value);
    else { fellBack++; errors.push(String(r.reason && r.reason.message || r.reason)); console.warn('AI parse failed for a chunk:', r.reason); items.push(...localParse(chunks[k])); }
  });
  return { items, fellBack, total:chunks.length, error:errors[0] };
}

function localParse(text) {
  const out = [];
  const wd = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  for (let line of text.split(/\n+/)) {
    line = line.replace(/^\s*[-•*]\s*/, '').trim();
    if (!line || /:\s*$/.test(line) || /^\d{1,2}\/\d{1,2}\b/.test(line)) continue;
    const p = { type:'task', title:line, cat:'life', win:'soon' };
    if (/\b(daily|every day|each day)\b/i.test(line)) { p.type = 'routine'; p.repeat = { days:'daily' }; }
    const dm = /\b(?:due|by|before)\s+(today|tomorrow|sun|mon|tue|wed|thu|fri|sat)[a-z]*(?:\s+(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?)?/i.exec(line);
    if (dm) {
      const w = dm[1].toLowerCase();
      let date = w === 'today' ? TODAY : w === 'tomorrow' ? addDays(TODAY, 1) : null;
      if (!date) { const target = wd.indexOf(w.slice(0, 3)); let k = 1; while (dow(addDays(TODAY, k)) !== target) k++; date = addDays(TODAY, k); }
      let time = null;
      if (dm[2]) { let h = +dm[2] % 12; if ((dm[4] || '').toLowerCase() === 'pm' || (!dm[4] && h < 8)) h += 12; time = `${String(h).padStart(2, '0')}:${dm[3] || '00'}`; }
      p.due = { date, time };
      p.win = diffDays(TODAY, date) <= 1 ? 'near' : 'week';
      p.title = line.replace(dm[0], '').replace(/\s{2,}/g, ' ').trim() || line;
    } else if (/\b(today|tomorrow|tonight)\b/i.test(line)) p.win = 'near';
    else if (/\bthis week\b/i.test(line)) p.win = 'week';
    if (/\?\s*$|\bmaybe\b/i.test(line)) p.win = 'decide';
    const wm = /\b(if|once|after|when)\b(.+)$/i.exec(line);
    if (wm && p.win !== 'decide') { p.win = 'waiting'; p.wait = cap(`${wm[1]}${wm[2]}`.trim()) + '?'; p.title = p.title.replace(wm[0], '').trim() || p.title; }
    p.title = cap(p.title.replace(/\b(this week|today|tomorrow|tonight)\b/i, '').replace(/\s{2,}/g, ' ').trim()) || line;
    if (/\b(buy|get|pick up|return|order)\b/i.test(line)) p.cat = 'errand';
    const tag = /#([\w-]+)/.exec(line);
    if (tag) { p.cat = tag[1]; p.title = p.title.replace(tag[0], '').replace(/\s{2,}/g, ' ').trim() || p.title; }
    if (/\b(pset|problem set|reading|essay|homework|lab|exam|quiz|midterm)\b/i.test(line)) p.cat = 'class';
    out.push(p);
  }
  return out;
}

function addParsed(list) {
  const added = [];
  for (const p of list) {
    const type = p.type || 'task';
    const title = (p.title || '').trim();
    if (!title) continue;
    const cat = resolveCat(p.cat, type);
    const st = hmStart(p.start), en = hmStart(p.end);
    if (type === 'class' && p.repeat && Array.isArray(p.repeat.days) && st != null && en != null && en > st) {
      const c = { id:uid(), code:title, kind:'', name:p.meta || '', days:p.repeat.days, start:st, end:en, loc:p.loc || '', ex:{} };
      S.classes.push(c); added.push({ id:c.id, kind:'class', title });
      continue;
    }
    if (type === 'routine') {
      const rep = p.repeat && Array.isArray(p.repeat.days) ? { days:p.repeat.days, every:p.repeat.every || 1, from:TODAY } : 'daily';
      const it = { id:uid(), kind:'routine', title, cat:'routine', dur:(st != null && en != null && en > st) ? en - st : (p.est ? +p.est[0] : 15), repeat:rep, doneOn:{} };
      S.items.push(it);
      if (st != null) S.rules.push({ id:uid(), itemId:it.id, start:st, dur:it.dur, ex:{} });
      added.push({ id:it.id, kind:'routine', title });
      continue;
    }
    if (type === 'event') {
      const date = /^\d{4}-\d{2}-\d{2}$/.test(p.date || '') ? p.date : ui.sel;
      if (st != null) {
        const o = { id:uid(), date, start:st, dur:(en != null && en > st) ? en - st : 60, title, cat, kind:p.tentative ? 'tentative' : 'fixed', label:p.tentative ? `Around ${fmtTime(st)}` : null };
        S.oneoffs.push(o); added.push({ id:o.id, kind:'event', title, date, at:st });
        continue;
      }
      const it = { id:uid(), kind:'task', win:'near', title, cat };
      if (p.meta) it.meta = p.meta;
      S.items.push(it); S.sometime.push({ itemId:it.id, date }); added.push({ id:it.id, kind:'task', title });
      continue;
    }
    const win = ['near', 'week', 'soon', 'ongoing', 'waiting', 'decide'].includes(p.win) ? p.win : 'soon';
    const it = { id:uid(), kind:'task', win, title, cat };
    if (p.meta) it.meta = p.meta;
    if (Array.isArray(p.est) && p.est.length === 2) it.est = [+p.est[0], +p.est[1]];
    if (p.sitting) it.dur = +p.sitting;
    if (p.session) { it.est = [+p.session, +p.session]; it.session = true; }
    if (p.due && /^\d{4}-\d{2}-\d{2}$/.test(p.due.date || '')) it.due = { date:p.due.date, time:hmRaw(p.due.time) };
    if (p.short) it.short = p.short;
    if (Array.isArray(p.steps) && p.steps.length) it.steps = p.steps.map(t => ({ t:String(t) }));
    if (win === 'waiting') {
      const q = p.wait || 'Has it happened yet?';
      let c = S.conditions.find(x => x.q.toLowerCase() === q.toLowerCase());
      if (!c) { c = { id:uid(), q }; S.conditions.push(c); }
      it.waitOn = c.id;
    }
    if (win === 'decide') it.yes = { title:title.replace(/\?\s*$/, ''), win:'soon' };
    S.items.push(it); added.push({ id:it.id, kind:'task', title });
  }
  return added;
}

function autosize() { const t = $('#qa'); t.style.height = 'auto'; t.style.height = Math.min(180, t.scrollHeight) + 'px'; }
$('#qa').addEventListener('input', autosize);
$('#qa').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const v = e.target.value.trim(); if (v) submitQuick(v); }
});

async function submitQuick(text) {
  const wrap = $('#qaWrap');
  wrap.classList.add('is-busy');
  $('#qa').disabled = true;
  const { items, fellBack, total, error } = await parseAll(text);
  wrap.classList.remove('is-busy');
  $('#qa').disabled = false;
  if (!items.length) { toast('Couldn’t find anything to add in that.'); return; }
  commitParsed(items, fellBack, total, error);
}

function commitParsed(list, fellBack, total, error) {
  const snap = snapshot();
  const added = addParsed(list);
  $('#qa').value = ''; autosize();
  const placed = S.settings.autoSchedule ? placeNew(added.filter(a => a.kind === 'task').map(a => item(a.id))) : [];
  ui.fresh = new Set(added.map(a => a.id));
  setTimeout(() => { ui.fresh = new Set(); }, 3500);
  renderAll();
  let msg;
  if (added.length === 1) {
    const a = added[0];
    if (a.kind === 'task') {
      const it = item(a.id), p = placed[0];
      msg = `Added “${a.title}” to ${WIN_LABEL[effWin(it)]}${p ? `, penciled in ${relWord(p.date)} at ${fmtTime(p.at)}` : ''}.`;
    } else if (a.kind === 'event') msg = `Added “${a.title}” on ${relWord(a.date)} at ${fmtTime(a.at)}.`;
    else msg = `Added ${a.kind} “${a.title}”.`;
  } else {
    const counts = {};
    added.forEach(a => counts[a.kind] = (counts[a.kind] || 0) + 1);
    const parts = Object.entries(counts).map(([k, n]) => `${n} ${k}${n > 1 ? (k === 'class' ? 'es' : 's') : ''}`);
    msg = `Added ${added.length} items: ${joinAnd(parts)}.${placed.length ? ` Penciled in ${placed.length}.` : ''}`;
  }
  msg += fellBack ? (fellBack === total ? ' The AI wasn’t reachable, so this is a simple guess.' : ' Part of this is a simple guess because the AI didn’t answer.') + (error ? ` (Reason: ${error.slice(0, 80)})` : '') : ' Sorted by AI.';
  toast(msg, [['Undo', () => restore(snap)]], 9000);
  const first = added.find(a => a.kind === 'task');
  if (first) {
    if (ui.layout === 'phone' && ui.drawer === 'peek') { ui.drawer = 'half'; applyDrawer(true); }
    requestAnimationFrame(() => { const el = document.querySelector(`.card[data-id="${first.id}"]`); if (el) el.scrollIntoView({ block:'nearest', behavior:'smooth' }); });
  }
}

/* ================= Time travel (testing only) ================= */
const SIMS = { now:null, fri:{ date:'2026-10-02', min:600 }, tue:{ date:'2026-10-06', min:1080 } };
function setSim(key) {
  if (key === 'now') {
    if (BASE) { S = JSON.parse(BASE); BASE = null; }
    SIM = null;
    TODAY = logicalToday();
  } else {
    if (!BASE) BASE = snapshot(); else S = JSON.parse(BASE);
    SIM = SIMS[key];
    TODAY = SIM.date;
  }
  ui.sim = key; ui.sel = TODAY; ui.view = 'day';
  const moved = rollover();
  const placed = moved.length && S.settings.autoSchedule ? placeNew(moved) : [];
  renderAll();
  if (key !== 'now') {
    let msg = `Pretending it’s ${longDate(TODAY)} at ${fmtTime(SIM.min)}.`;
    if (moved.length) msg += ` ${moved.length} unfinished task${moved.length > 1 ? 's' : ''} moved to today${placed.length ? `, ${placed.length} penciled in` : ''}.`;
    toast(msg, [], 8000);
  } else toast('Back to the real time. Changes made while pretending were dropped.');
}

/* ================= Controls and shortcuts ================= */
function shift(dir) {
  if (ui.view === 'day') ui.sel = addDays(ui.sel, dir);
  else if (ui.view === 'week') ui.sel = addDays(ui.sel, 7 * dir);
  else { const d = toDate(ui.sel); ui.sel = toStr(new Date(d.getFullYear(), d.getMonth() + dir, 1)); }
  ui.open = null;
  renderAll();
}
$('#backWide').onclick = $('#backPhone').onclick = () => { ui.sel = TODAY; renderAll(); };
$('#setBtn').onclick = openSettings;

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (drag) cancelDrag();
    if (pop) { closePopover(); return; }
    if (document.querySelector('.dialog-wrap')) { closeDialog(); return; }
    if (ui.settingsOpen) { closeSettings(); return; }
    if (ui.layout === 'phone' && ui.drawer !== 'peek') { ui.drawer = 'peek'; applyDrawer(true); }
    return;
  }
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey || ui.settingsOpen) return;
  if (document.querySelector('.dialog-wrap')) return;
  const k = e.key;
  if (k === 'n') { e.preventDefault(); if (ui.view !== 'day') { ui.view = 'day'; renderAll(); } if (ui.layout === 'phone') { ui.drawer = 'half'; applyDrawer(true); } $('#qa').focus(); }
  else if (k === 't') { ui.sel = TODAY; renderAll(); }
  else if (k === 'ArrowLeft') shift(-1);
  else if (k === 'ArrowRight') shift(1);
  else if (k === 'd' || k === 'w' || k === 'm') { ui.view = { d:'day', w:'week', m:'month' }[k]; renderAll(); }
  else if (k === 'p' && ui.view === 'day') runPlan();
  else if (k === '?') toast('Shortcuts: N add, P plan, T today, arrow keys change day, D W M switch views.', [], 8000);
});

const OPTS = [
  { key:'layout', label:'Layout', vals:[['wide', 'Wide'], ['phone', 'Phone']] },
  { key:'phoneWeek', label:'Phone week', vals:[['stack', 'One day per row'], ['grid', 'Time grid, swipe sideways']] },
  { key:'sim', label:'Pretend it’s', vals:[['now', 'Now'], ['fri', 'Fri Oct 2, 10am'], ['tue', 'Tue Oct 6, 6pm']] },
];
function renderHarness() {
  const h = $('#harness');
  h.innerHTML = OPTS.map(o => `<div class="opt"><span>${o.label}</span><div class="seg">${o.vals.map(([v, l]) => `<button data-k="${o.key}" data-v="${v}" aria-pressed="${ui[o.key] === v}">${l}</button>`).join('')}</div></div>`).join('');
  h.querySelectorAll('button').forEach(b => b.onclick = () => {
    closePopover();
    if (b.dataset.k === 'sim') { setSim(b.dataset.v); return; }
    ui[b.dataset.k] = b.dataset.v;
    renderAll();
    renderSettings();
    if (b.dataset.k === 'layout') scrollToNow();
  });
}

function scrollToNow() {
  if (ui.view !== 'day' || ui.sel !== TODAY || ui.layout !== 'phone') return;
  requestAnimationFrame(() => {
    const sc = scroller(), g = $('#grid');
    sc.scrollTop += g.getBoundingClientRect().top - sc.getBoundingClientRect().top + yOf(nowMin() - 60) - 20;
  });
}

setInterval(() => {
  if (drag || document.querySelector('.dialog-wrap')) return;
  if (!SIM) {
    const t = logicalToday();
    if (t !== TODAY) {
      const wasToday = ui.sel === TODAY;
      TODAY = t;
      if (wasToday) ui.sel = t;
      const moved = rollover();
      if (moved.length && S.settings.autoSchedule) placeNew(moved);
      renderAll();
      if (moved.length) toast(`${moved.length} unfinished task${moved.length > 1 ? 's' : ''} moved to today.`);
      return;
    }
  }
  applyAttrs();
  renderHeader();
  if (ui.view === 'day') renderDay();
}, 30000);

/* ================= Start ================= */
if (window.innerWidth < 640) { ui.layout = 'phone'; document.body.classList.add('real-phone'); }
const movedAtStart = rollover();
renderAll();
scrollToNow();
if (movedAtStart.length) toast(`${movedAtStart.length} unfinished task${movedAtStart.length > 1 ? 's' : ''} moved to today.`);
</script>
